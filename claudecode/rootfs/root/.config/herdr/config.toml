# Defaults shipped with the Claude Code add-on. This file is copied once to
# /homeassistant/.claudecode/herdr.toml on first start and read from there, so
# your edits survive restarts, rebuilds and reinstalls. Apply changes with
# `herdr server reload-config`, or restart the add-on.
#
# Full reference: https://herdr.dev/docs/config-reference/

# The web terminal has no place to complete a first-run notification setup.
onboarding = false

[terminal]
# Panes must be login shells so /root/.profile -> /root/.bashrc runs and the
# add-on aliases (c, cc, ha-config, ha-logs) exist inside them.
default_shell = "/bin/bash"
shell_mode = "login"

[update]
# The add-on ships a pinned herdr and replaces it on rebuild. Self-updating
# would desync the client from the running server, so don't advertise updates.
version_check = false

[ui]
# The Home Assistant sidebar panel is narrow; start with room for the terminal.
sidebar_start_collapsed = true

# herdr keeps the mouse, so its sidebar is clickable and selecting text copies
# through OSC 52. The add-on teaches ttyd's terminal to receive that, so copies
# reach the clipboard of the machine running the browser.
#
# Set false to hand the mouse to the browser instead and use native selection.
mouse_capture = true
